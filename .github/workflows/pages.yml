name: Deploy static site to Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/build-static-data.mjs"
      - "scripts/assemble-static-site.mjs"
      - "server.js"
      - "lib/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Data refreshes are committed by the update workflow with GITHUB_TOKEN, and
  # such pushes never start another workflow. Rebuild the site when that job
  # finishes so the published snapshot keeps up with the committed data.
  workflow_run:
    workflows: ["Update A-share data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # One cache entry per day: the day's first build pays for the K-line
      # downloads, later builds reuse them and just top up the missing session.
      - name: Cache key
        id: cachekey
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore the history cache
        uses: actions/cache@v4
        with:
          path: .cache/history
          key: history-${{ steps.cachekey.outputs.day }}
          restore-keys: |
            history-

      # The per-stock chart files are generated from this cache, so a warm cache
      # means every stock has a K-line instead of only the curated ones.
      - name: Warm the history cache
        continue-on-error: true
        run: npm run history

      - name: Build the static data bundle
        run: node scripts/build-static-data.mjs

      - name: Assemble the site
        run: node scripts/assemble-static-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
