name: Update A-share data

on:
  workflow_dispatch:
  schedule:
    # GitHub's scheduler routinely starts a job 5-20 minutes late, so every slot
    # is pulled forward: the run is meant to be finished by the time the reader
    # opens the page, not to start then. Asia/Shanghai is UTC+8.
    # 15:05 CST -> done ~15:25, in time for the post-close review.
    - cron: "5 7 * * 1-5"
    # 19:30 CST -> done ~19:50, the evening refresh.
    - cron: "30 11 * * 1-5"
    # 08:40 CST -> done ~09:00, after the overnight US session closed.
    - cron: "40 0 * * 1-5"
    # Sunday 19:00 CST -> the weekend catch-up, before Monday's open.
    - cron: "0 11 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync market data
        run: npm run update

      # Enrichment sources are independent third-party services; a single flaky
      # feed must not fail the daily data commit, so each step is tolerant.
      - name: Sync sector membership
        continue-on-error: true
        run: npm run sectors

      - name: Sync history and indicators
        continue-on-error: true
        run: npm run history

      # Eastmoney publishes PE / PB / turnover / volume ratio only on its quote
      # endpoint, not in the Sina universe snapshot. Without this the PE column
      # and the quote grid have nothing to show.
      - name: Sync valuation snapshot
        continue-on-error: true
        run: npm run profiles

      - name: Sync events and news
        continue-on-error: true
        run: npm run news

      # US treasury yields come from FRED; without them the 明日参考 board drops
      # its 美债10年期 driver and says so, rather than inventing a value.
      - name: Sync macro backdrop
        continue-on-error: true
        run: npm run macro

      - name: Sync money flow
        continue-on-error: true
        run: npm run flow

      # New listings and ex-dividend days (XD/XR prefixes) change the names in
      # the universe, so the committed pinyin index has to follow. pinyin-pro is
      # installed only here and never becomes a runtime dependency.
      - name: Rebuild pinyin index
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund pinyin-pro
          npm run index:pinyin

      # The flow snapshot records which sessions actually happened, so it doubles
      # as the trading calendar. Rebuilding it here keeps "下一交易日" honest.
      - name: Rebuild trading calendar
        continue-on-error: true
        run: npm run index:calendar

      - name: API smoke test
        run: npm run check:api

      # The smoke test is what serves /api/outlook, which records tonight's call.
      # Grading it here keeps the hit rate anchored to what was actually shown.
      - name: Grade the previous outlook calls
        continue-on-error: true
        run: npm run outlook:history

      # Optional egress: without the ALERT_WEBHOOK_URL secret this just prints the
      # digest into the job log, which is still useful and never fails the run.
      - name: Push the alert digest
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
        run: npm run notify

      - name: Commit updated data
        run: |
          FILES="data/all-a-shares.json data/meta.json data/sectors.json data/indicators.json data/profiles.json data/events.json data/indices.json data/macro.json data/flow.json data/outlook-history.json data/alert-digest.json data/watchlist.json lib/pinyin-index.json lib/trading-days.json"
          TRACKED=""
          for f in $FILES; do
            if [ -f "$f" ]; then TRACKED="$TRACKED $f"; fi
          done

          # `git diff` only sees tracked files; status also catches the two
          # snapshots that may be created for the very first time.
          if [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "Update A-share market data"

          # A push from a human can land while this job is syncing, which makes
          # the plain push fail as a non-fast-forward. Rebase onto it and retry;
          # every file here is regenerated from scratch, so keep ours when the
          # rebase would conflict.
          for attempt in 1 2 3; do
            if git fetch origin "$GITHUB_REF_NAME" \
              && git rebase --autostash -X theirs FETCH_HEAD \
              && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt $attempt failed; retrying."
            sleep 5
          done
          echo "Could not push the refreshed data."
          exit 1
