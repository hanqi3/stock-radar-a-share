name: Update A-share data

on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC = 15:30 Asia/Shanghai, right after the A-share close on weekdays.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync market data
        run: npm run update

      # Enrichment sources are independent third-party services; a single flaky
      # feed must not fail the daily data commit, so each step is tolerant.
      - name: Sync sector membership
        continue-on-error: true
        run: npm run sectors

      - name: Sync history and indicators
        continue-on-error: true
        run: npm run history

      - name: Sync events and news
        continue-on-error: true
        run: npm run news

      - name: Sync money flow
        continue-on-error: true
        run: npm run flow

      - name: API smoke test
        run: npm run check:api

      - name: Commit updated data
        run: |
          FILES="data/all-a-shares.json data/meta.json data/sectors.json data/indicators.json data/events.json data/indices.json data/flow.json"
          TRACKED=""
          for f in $FILES; do
            if [ -f "$f" ]; then TRACKED="$TRACKED $f"; fi
          done

          if git diff --quiet -- $TRACKED; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "Update A-share market data"
          git push
