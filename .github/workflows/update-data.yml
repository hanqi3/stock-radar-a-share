name: Update A-share data

on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC = 15:30 Asia/Shanghai, right after the A-share close on weekdays.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync market data
        run: npm run update

      # Enrichment sources are independent third-party services; a single flaky
      # feed must not fail the daily data commit, so each step is tolerant.
      - name: Sync sector membership
        continue-on-error: true
        run: npm run sectors

      - name: Sync history and indicators
        continue-on-error: true
        run: npm run history

      - name: Sync events and news
        continue-on-error: true
        run: npm run news

      # US treasury yields come from FRED; without them the 明日参考 board drops
      # its 美债10年期 driver and says so, rather than inventing a value.
      - name: Sync macro backdrop
        continue-on-error: true
        run: npm run macro

      - name: Sync money flow
        continue-on-error: true
        run: npm run flow

      # New listings and ex-dividend days (XD/XR prefixes) change the names in
      # the universe, so the committed pinyin index has to follow. pinyin-pro is
      # installed only here and never becomes a runtime dependency.
      - name: Rebuild pinyin index
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund pinyin-pro
          npm run index:pinyin

      # The flow snapshot records which sessions actually happened, so it doubles
      # as the trading calendar. Rebuilding it here keeps "下一交易日" honest.
      - name: Rebuild trading calendar
        continue-on-error: true
        run: npm run index:calendar

      - name: API smoke test
        run: npm run check:api

      # The smoke test is what serves /api/outlook, which records tonight's call.
      # Grading it here keeps the hit rate anchored to what was actually shown.
      - name: Grade the previous outlook calls
        continue-on-error: true
        run: npm run outlook:history

      # Optional egress: without the ALERT_WEBHOOK_URL secret this just prints the
      # digest into the job log, which is still useful and never fails the run.
      - name: Push the alert digest
        continue-on-error: true
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_FORMAT: ${{ vars.ALERT_WEBHOOK_FORMAT }}
        run: npm run notify

      - name: Commit updated data
        run: |
          FILES="data/all-a-shares.json data/meta.json data/sectors.json data/indicators.json data/events.json data/indices.json data/macro.json data/flow.json data/outlook-history.json data/alert-digest.json data/watchlist.json lib/pinyin-index.json lib/trading-days.json"
          TRACKED=""
          for f in $FILES; do
            if [ -f "$f" ]; then TRACKED="$TRACKED $f"; fi
          done

          # `git diff` only sees tracked files; status also catches the two
          # snapshots that may be created for the very first time.
          if [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "Update A-share market data"
          git push
