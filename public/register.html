<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>注册 · StockRadar</title>
    <link rel="stylesheet" href="/auth.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="auth-brand"><span class="auth-logo" aria-hidden="true">◎</span> StockRadar</div>
      <h1>创建账号</h1>
      <p class="auth-sub">一个账号同步你的自选股和提醒，换手机也不用重来。</p>

      <form id="authForm" data-auth="register" novalidate>
        <label class="auth-field">
          <span>昵称（可选）</span>
          <input id="name" name="name" type="text" autocomplete="nickname" maxlength="24" placeholder="例如：阿琪" />
        </label>
        <label class="auth-field">
          <span>邮箱</span>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com" required />
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="8–128 位" required />
        </label>
        <label class="auth-field">
          <span>确认密码</span>
          <input id="password2" name="password2" type="password" autocomplete="new-password" placeholder="再输入一次" required />
        </label>
        <p class="auth-error" id="authError" role="alert" hidden></p>
        <button class="auth-submit" type="submit">注册并登录</button>
      </form>

      <div class="auth-divider"><span>或者</span></div>
      <button class="auth-guest" id="guestButton" type="button">
        <span aria-hidden="true">👀</span> 先随便看看 · 游客登录
      </button>
      <p class="auth-hint auth-guest-hint">游客模式不需要账号，自选只保存在本机。</p>

      <details class="auth-server" id="serverBox">
        <summary>服务器地址</summary>
        <label class="auth-field">
          <span>API 地址</span>
          <input id="serverBase" name="serverBase" type="url" inputmode="url" autocomplete="url" placeholder="https://your-server.com" />
        </label>
        <p class="auth-hint" id="serverHint">网页版留空即可；手机 App 需填写后端公网地址。</p>
      </details>

      <p class="auth-switch">已有账号？<a href="/login.html">去登录</a></p>
    </main>
    <script type="module" src="/auth.js"></script>
  </body>
</html>
